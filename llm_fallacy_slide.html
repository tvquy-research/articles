<blockquote>

<li>Dù nếu không có AI, chưa chắc tôi làm được</li>
</ul>

<header>The LLM Fallacy</header>
<h2 id="kh%C3%B4ng-ph%E1%BA%A3i-hallucination">Không phải hallucination</h2>
<p><strong>Hallucination</strong></p>
<ul>
<li>Hệ thống bịa hoặc trả lời sai</li>
<li>Trọng tâm là độ đúng của output</li>
</ul>
<p><strong>LLM fallacy</strong></p>
<ul>
<li>Output đúng hay sai đều có thể gây ngộ nhận</li>
<li>Trọng tâm là cách người dùng quy output về năng lực của mình</li>
</ul>
<div class="takeaway">Ngay cả câu trả lời đúng cũng có thể làm lệch tự đánh giá năng lực.</div>
<div class="ref">Ref: [1] Kim, Yu & Yi, 2026</div>
<footer>Tran Quy</footer>

<header>The LLM Fallacy</header>
<h2 id="kh%C3%B4ng-ch%E1%BB%89-automation-bias">Không chỉ automation bias</h2>
<p><strong>Automation bias</strong></p>
<ul>
<li>Người dùng quá tin vào hệ thống khi ra quyết định</li>
</ul>
<p><strong>LLM fallacy</strong></p>
<ul>
<li>Người dùng hiểu sai về phần năng lực thực sự thuộc về mình</li>
<li>Vấn đề nằm ở <strong>tự nhận thức</strong>, không chỉ ở quyết định</li>
</ul>
<div class="ref">Ref: [1] Kim, Yu & Yi, 2026</div>
<footer>Tran Quy</footer>
</section>

<header>The LLM Fallacy</header>
<h2 id="kh%C3%B4ng-ch%E1%BB%89-cognitive-offloading">Không chỉ cognitive offloading</h2>
<p><strong>Cognitive offloading</strong></p>
<ul>
<li>Đẩy bớt gánh nặng tư duy ra ngoài công cụ</li>
</ul>
<p><strong>LLM fallacy</strong></p>
<ul>
<li>Sau khi đã offload, người dùng lại quy kết quả đó về “tôi làm được”</li>
<li>Bước sai nằm ở <strong>quy gán sau kết quả</strong></li>
</ul>
<div class="ref">Ref: [1] Kim et al., 2026; [9] Risko & Gilbert, 2016</div>

<p>Người dùng đưa prompt ngắn, chỉnh vài vòng, rồi nhận được output mạch lạc.</p>

<header>The LLM Fallacy</header>
<h2 id="3-cognitive-outsourcing">3. Cognitive outsourcing</h2>

<header>The LLM Fallacy</header>
<h2 id="4-pipeline-opacity">4. Pipeline opacity</h2>
<p>Người dùng thấy:</p>
<ul>
<li>đầu vào: prompt</li>
<li>đầu ra: câu trả lời</li>

<ul>

<li>phần nào là suy luận, phần nào là tái diễn đạt</li>
<li>mức độ chắc chắn của bằng chứng</li>
</ul>
<div class="ref">Ref: [1] Kim et al., 2026; [7] Clark et al., 2025</div>

<header>The LLM Fallacy</header>
<h2 id="v%C3%AD-d%E1%BB%A5-1-l%E1%BA%ADp-tr%C3%ACnh">Ví dụ 1: Lập trình</h2>
<p>Một sinh viên dùng LLM sinh backend chạy được.</p>
<p>Sau vài chỉnh sửa nhỏ, em nghĩ mình đã biết xây hệ thống.</p>
<p>Nhưng khi cần:</p>
<ul>
<li>giải thích kiến trúc</li>
<li>sửa bug mới</li>
<li>viết lại từ đầu</li>
<li>chọn trade-off kỹ thuật</li>
</ul>
<p>em bắt đầu lúng túng.</p>
<div class="takeaway">Code chạy được không đồng nghĩa với understanding đã nội tại hóa.</div>
<div class="ref">Ref: [1] Kim et al., 2026; [4] Nam et al., 2024</div>
<footer>Tran Quy</footer>

<h2 id="v%C3%AD-d%E1%BB%A5-2-ti%E1%BA%BFng-anh">Ví dụ 2: Tiếng Anh</h2>
<p>Một người dùng AI để viết email tiếng Anh rất mượt.</p>
<p>Sau vài tuần, người đó tin rằng mình viết tiếng Anh tốt.</p>
<p>Nhưng khi phải:</p>
<ul>
<li>nói trực tiếp</li>
<li>tự chọn cấu trúc ngữ pháp</li>
<li>giải thích vì sao câu này đúng</li>
<li>viết không có AI hỗ trợ</li>
</ul>
<p>năng lực độc lập có thể không tương xứng.</p>
<div class="ref">Ref: [1] Kim et al., 2026; [10] Reber et al., 2004</div>

<h2 id="v%C3%AD-d%E1%BB%A5-3-%C4%91%E1%BB%8Dc-paper">Ví dụ 3: Đọc paper</h2>
<p>Một người nhờ AI tóm tắt bài báo khó.</p>
<p>Bản tóm tắt giúp họ có cảm giác “mình hiểu rồi”.</p>
<p>Nhưng khi bị hỏi về:</p>
<ul>
<li>giả định phương pháp</li>
<li>giới hạn dữ liệu</li>
<li>điểm yếu logic</li>
<li>tranh luận học thuật liên quan</li>
</ul>
<p>họ không trả lời được.</p>
<div class="takeaway">Tiếp cận thông tin không bằng nắm vững tri thức.</div>
<div class="ref">Ref: [1] Kim et al., 2026; [7] Clark et al., 2025</div>

<p>Ứng viên dùng AI để luyện trả lời, viết CV và portfolio.</p>
<p>Hồ sơ đẹp, câu trả lời mạch lạc.</p>

<li>giải thích độc lập</li>

<header>The LLM Fallacy</header>
<h2 id="learning-with-ai-assistance">Learning with AI Assistance</h2>
<p>Karny và cộng sự đặt câu hỏi:</p>
<blockquote>
<p>AI giúp người học tiến bộ thật, hay chỉ giúp họ dựa dẫm vào hỗ trợ?</p>
</blockquote>
<p>Ý nghĩa với giáo dục:</p>
<ul>
<li>điểm số hoặc output tốt hơn chưa chắc là học sâu hơn</li>
<li>cần phân biệt task performance và competence tăng thật</li>
</ul>
<div class="ref">Ref: [3] Karny et al., 2024</div>
<footer>Tran Quy</footer>

<header>The LLM Fallacy</header>
<h2 id="code-understanding">Code understanding</h2>
<p>Nam và cộng sự cho thấy LLM có thể hỗ trợ hiểu mã nguồn trong một số tình huống.</p>
<p>Điều này không bác bỏ LLM fallacy.</p>
<p>Ngược lại:</p>
<ul>
<li>AI càng hữu ích, người dùng càng dễ tin rằng mình đã hiểu</li>
<li>cần kiểm tra khả năng giải thích và sửa đổi độc lập</li>
</ul>

<header>The LLM Fallacy</header>
<h2 id="work-patterns-v%E1%BB%9Bi-generative-ai">Work patterns với generative AI</h2>

<div class="takeaway">AI đang trở thành hạ tầng nhận thức hằng ngày, không còn là công cụ rìa ngoài.</div>

<p>Lee và cộng sự cho thấy LLM-judges có thể bị ảnh hưởng bởi các dấu hiệu ngôn ngữ thể hiện sự bất định.</p>

<footer>Tran Quy</footer>

<header>The LLM Fallacy</header>
<h2 id="th%C3%B4ng-%C4%91i%E1%BB%87p-ch%C3%ADnh">Thông điệp chính</h2>
<ol>
<li>AI không chỉ tăng năng suất; AI còn tái cấu trúc cách ta tự đánh giá mình</li>
<li>Output tốt không còn đủ để suy ra năng lực cá nhân</li>
<li>Cần phân biệt dùng được AI, tạo được sản phẩm và hiểu bản chất độc lập</li>
<li>Giáo dục và tuyển dụng cần chuyển từ output-centric sang process-aware evaluation</li>
<li>Mục tiêu không phải loại bỏ AI, mà là nâng AI literacy và metacognitive literacy</li>
</ol>
<div class="ref">Ref: [1] Kim, Yu & Yi, 2026</div>
<footer>Tran Quy</footer>

  border-left: 6px solid #B5451B;
  background: #F5E6DC;
  font-weight: 700;
}
section .ref {
  position: absolute;
  left: 70px;
  right: 70px;
  bottom: 44px;
  font-size: 15px;
  color: #666;
}
section .small {
  font-size: 18px;
}
section .grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}
section .grid-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}
section .box {
  border: 1px solid #D7D2CC;
  border-radius: 8px;
  padding: 14px 16px;
  background: #FFFDF9;
}
section .box h3 {
  margin-top: 0;
  margin-bottom: 8px;
}
